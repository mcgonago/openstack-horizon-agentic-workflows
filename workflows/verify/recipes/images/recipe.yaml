name: images
label: Images Panel — Activate/Deactivate Row Actions
description: >
  Verify the new DeactivateImage and ReactivateImage row actions
  added to the Images table as part of the de-angularize initiative.
  These actions are gated on image ownership and status.

match_files:
  - openstack_dashboard/dashboards/project/images/

environment:
  devstack_host: "${DEVSTACK_HOST}"
  admin_user: admin
  admin_password: "${DEVSTACK_PASSWORD}"
  horizon_port: 8080
  virtctl:
    enabled: false
    vm: omcgonag-horizon-devstack
    namespace: rhos-dfg-ui--runtime-int
    identity_file: "~/.ssh/id_ed25519"
    ssh_user: ubuntu
    openrc: "~/devstack/openrc admin demo"

angular_features:
  images_panel: false

setup:
  - "openstack image show verify-seed-image 2>/dev/null && openstack image set --unprotect verify-seed-image 2>/dev/null && openstack image delete verify-seed-image 2>/dev/null || true"
  - "dd if=/dev/zero of=/tmp/tiny.img bs=1 count=1 2>/dev/null"
  - "openstack image create --disk-format raw --container-format bare --file /tmp/tiny.img verify-seed-image"
  - "rm -f /tmp/tiny.img"

cleanup:
  - "openstack image set --unprotect verify-seed-image 2>/dev/null || true"
  - "openstack image set --activate verify-seed-image 2>/dev/null || true"
  - "openstack image delete verify-seed-image 2>/dev/null || true"

groups:
  - name: A
    label: Panel Loading
    module: panel_loading
    tests:
      - page_loads
      - breadcrumb_visible
      - table_visible
      - angular_or_python_detected

  - name: B
    label: Table Features
    module: table_features
    tests:
      - search_filter
      - column_headers
      - row_actions_menu
      - batch_actions

  - name: C
    label: Activate / Deactivate Actions
    module: activate_deactivate
    tests:
      - deactivate_action_visible_on_active_owned
      - deactivate_action_hidden_on_not_owned
      - execute_deactivate
      - reactivate_action_visible_on_deactivated
      - execute_reactivate
      - protected_image_no_deactivate
